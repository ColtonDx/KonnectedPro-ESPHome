# WEB SEVER
# Enables the built-in web server for viewing the device state, internals and controls via web browser
# on the same local network as the device.
web_server:
  include_internal: true

####
# LOGGER
# more: https://esphome.io/components/logger.html
logger:


wiegand:
  - id: Keypad
    d0: $keypad_d0_zone
    d1: $keypad_d1_zone
    on_key:
      - lambda: |-
          ESP_LOGI("KEY", "received key %d", x);
          if (x == 11) {
            // optional: clear any partial PIN entry
            id(pincode_reader).clear();
            // optional: reset incorrect code counter
            id(incorrect_codes) = 0;
            // trigger the arming away transition
            id(alarm_states).transition("arm_away");
          }
    on_tag:
      - lambda: ESP_LOGI("TAG", "received tag %s", x.c_str());
    on_raw:
      - lambda: ESP_LOGI("RAW", "received raw %d bits, value %llx", bits, value);

key_collector:
  - id: pincode_reader
    source_id: Keypad
    min_length: 4
    max_length: 4
    end_keys: "*"
    end_key_required: false
    clear_keys: "*"
    allowed_keys: "0123456789"
    timeout: 5s
    on_progress:
      - logger.log:
          format: "input progress: '%s', started by '%c'"
          args: [ 'x.c_str()', "(start == 0 ? '~' : start)" ]
    on_result:
      - logger.log:
          format: "input result: '%s', started by '%c', ended by '%c'"
          args: [ 'x.c_str()', "(start == 0 ? '~' : start)", "(end == 0 ? '~' : end)" ]
      - lambda: |-
          std::string codes_str = "${alarm_code}";
          std::string code_param = x.c_str();
          size_t code_start = 0;
          size_t code_end = 0;
          bool code_matched = false;
          
          while ((code_end = codes_str.find(',', code_start)) != std::string::npos) {
            std::string single_code = codes_str.substr(code_start, code_end - code_start);
            single_code.erase(0, single_code.find_first_not_of(" \t"));
            single_code.erase(single_code.find_last_not_of(" \t") + 1);
            
            if (single_code == code_param) {
              code_matched = true;
              break;
            }
            code_start = code_end + 1;
          }
          
          if (!code_matched) {
            std::string last_code = codes_str.substr(code_start);
            last_code.erase(0, last_code.find_first_not_of(" \t"));
            last_code.erase(last_code.find_last_not_of(" \t") + 1);
            if (last_code == code_param) {
              code_matched = true;
            }
          }
          
          if (code_matched) {
            id(incorrect_codes) = 0;
            id(alarm_states).transition("disarm");
          } else {
            id(incorrect_codes) += 1;
            if (id(incorrect_codes) >= 3) {
              id(alarm_states).transition("trigger");
            }
          }


    on_timeout:
      - logger.log:
          format: "input timeout: '%s', started by '%c'"
          args: [ 'x.c_str()', "(start == 0 ? '~' : start)" ]


esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: update_keypad

api:
  encryption:
    key:

  services:
    - service: arm
      then:
        - state_machine.transition: arm
    - service: disarm
      variables:
        code: string
      then:
        - lambda: |-
            std::string codes_str = "${alarm_code}";
            std::string code_param = code;
            size_t code_start = 0;
            size_t code_end = 0;
            bool code_matched = false;
            
            while ((code_end = codes_str.find(',', code_start)) != std::string::npos) {
              std::string single_code = codes_str.substr(code_start, code_end - code_start);
              single_code.erase(0, single_code.find_first_not_of(" \t"));
              single_code.erase(single_code.find_last_not_of(" \t") + 1);
              
              if (single_code == code_param) {
                code_matched = true;
                break;
              }
              code_start = code_end + 1;
            }
            
            if (!code_matched) {
              std::string last_code = codes_str.substr(code_start);
              last_code.erase(0, last_code.find_first_not_of(" \t"));
              last_code.erase(last_code.find_last_not_of(" \t") + 1);
              if (last_code == code_param) {
                code_matched = true;
              }
            }
            
            if (code_matched) {
              id(alarm_states).transition("disarm");
            }

