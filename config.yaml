####
# GENERAL SETTINGS
# Customize these variables to your preferences and needs
# more: https://esphome.io/guides/configuration-types.html#substitutions
substitutions:
  name: konnected-poe
  friendly_name: Konnected Alarm Panel
  project_name: konnected.alarm-panel-pro-esp32-local-keypad
  project_version: "0.2.2-tb"
  sensor_debounce_time: 200ms
  blink_on_state: "true"
  ####
  # ALARM CONFIG
  alarm_code: !secret alarm_master_code
  disarmed_state: '0'
  arming_state: '1'
  armed_away_state: '2'
  armed_home_state: '3'
  pending_state: '4'
  triggered_state: '5'

  ##################
  # Zone Names     #
  ##################
  zone5_name: "Zone 05"
  zone6_name: "Zone 06"
  zone7_name: "Zone 07"
  zone8_name: "Zone 08"
  zone9_name: "Zone 09"
  zone10_name: "Zone 10"
  zone11_name: "Zone 11"
  zone12_name: "Zone 12"

  ##################
  # Keypad MAPPING #
  ##################
  #Keypad 1
  keypad_d0_zone: $zone2
  keypad_d1_zone: $zone3
  keypad_led_zone: $zone1
  keypad_beep_zone: $zone4
  
  # yamllint disable-line rule:line-length
  state_strings: '{"disarmed", "arming", "armed_away", "armed_home", "pending", "triggered"}'

  ##################
  #  ZONE MAPPING  #
  ##################
  # Do not edit this section. It's Konnected Pro specific things.
  zone1: GPIO4
  zone2: GPIO2
  zone3: GPIO15
  zone4: GPIO13
  zone5: GPIO18
  zone6: GPIO14
  zone7: GPIO33
  zone8: GPIO32
  zone9: GPIO36
  zone10: GPIO39
  zone11: GPIO34
  zone12: GPIO35
  alarm1: GPIO12
  alarm2: GPIO5
  out1: GPIO23
  out2: GPIO5
  status_led: GPIO3
  # Ethernet Config
  ethernet_type: LAN8720

packages:
