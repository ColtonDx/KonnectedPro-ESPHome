####
# STATE MACHINE
# The logic of armed and disarmed states and transitions is defined here
external_components:
  source: github://muxa/esphome-state-machine
  components:
    - state_machine

 ##################
 # STATE MACHINES #
 ##################
state_machine:
  id: alarm_states
  diagram: mermaid
  initial_state: 'disarmed'
  states:
    - name: 'disarmed'
      on_enter:
        - script.execute: update_keypad
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "disarmed"

    - name: 'arming'
      on_enter:
        - script.execute: flash_keypad_led
        - script.execute: beeper_countdown
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "arming"
        - delay: !lambda |-
            return (uint32_t) (id(arming_timeout).state * 1000);
        - state_machine.transition: arm_away
      on_leave:
        - script.stop: flash_keypad_led
        - script.stop: beeper_countdown

    - name: 'armed_away'
      on_enter:
        - script.execute: update_keypad
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "armed_away"

    - name: 'armed_home'
      on_enter:
        - script.execute: update_keypad
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "armed_home"

    - name: 'pending'
      on_enter:
        - script.execute: update_keypad
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "pending"
        - delay: !lambda |-
            return (uint32_t) (id(pending_timeout).state * 1000);
        - state_machine.transition: trigger

    - name: 'triggered'
      on_enter:
        - script.execute: flash_keypad_led
        - script.execute: beeper_countdown
        - text_sensor.template.publish:
            id: alarm_state_text
            state: "triggered"
        - if:
            condition:
              switch.is_on: trigger_siren
            then:
              - switch.turn_on: alarm1
        - delay: !lambda |-
            return (uint32_t) (id(trigger_timeout).state * 60 * 1000);
        - state_machine.transition: arm_away
      on_leave:
        - switch.turn_off: alarm1


  inputs:
    - name: arm_away
      transitions:
        - disarmed -> arming
        - arming -> armed_away
        - triggered -> armed_away

    - name: arm_home
      transitions:
        - disarmed -> armed_home

    - name: disarm
      transitions:
        - arming -> disarmed
        - armed_away -> disarmed
        - armed_home -> disarmed
        - pending -> disarmed
        - triggered -> disarmed

    - name: toggle
      transitions:
        - arming -> disarmed
        - armed_away -> disarmed
        - armed_home -> disarmed
        - pending -> disarmed
        - triggered -> disarmed
        - disarmed -> arming

    - name: trip
      transitions:
        - armed_away -> pending
        - armed_home -> pending

    - name: trigger
      transitions:
        - armed_away -> triggered
        - armed_home -> triggered
        - pending -> triggered

##################
#    SCRIPTS     #
##################

script:
  - id: evaluate_alarm
    then:
      - if:
          condition:
            and:
              - or:
                  - state_machine.state: armed_away
                  - state_machine.state: armed_home
              - or:
                  - lambda: return id(zone5).state;
                  - lambda: return id(zone6).state;
                  - lambda: return id(zone7).state;
                  - lambda: return id(zone8).state;
                  - lambda: return id(zone9).state;
                  - lambda: return id(zone10).state;
                  - lambda: return id(zone11).state;
                  - lambda: return id(zone12).state;
          then:
            - state_machine.transition: trip

  - id: update_keypad
    then:
      - if:
          condition:
            or:
              - state_machine.state: disarmed
              - state_machine.state: triggered
          then:
            - script.stop: flash_keypad_led
            - output.turn_off: keypad_led
            - output.turn_on: keypad_led
          else:
            - if:
                condition:
                  or:
                    - state_machine.state: arming
                    - state_machine.state: pending
                then:
                  - script.execute: flash_keypad_led
                  - script.execute: beeper_countdown
                else:
                  - script.stop: flash_keypad_led
                  - script.stop: beeper_countdown
                  - output.turn_off: keypad_beep
                  - output.turn_off: keypad_led

  - id: flash_keypad_led
    mode: restart
    then:
      - output.turn_on: keypad_led
      - delay: 250ms
      - output.turn_off: keypad_led
      - delay: 250ms
      - script.execute: flash_keypad_led

  - id: beeper_countdown
    mode: restart
    then:
      - output.turn_on: keypad_beep
      - delay: 200ms
      - output.turn_off: keypad_beep
      - delay: 750ms
      - script.execute: beeper_countdown

globals:
  - id: alarm_state_global
    type: 'uint8_t'
    restore_value: true
    initial_value: '0'
  - id: incorrect_codes
    type: 'uint8_t'
    restore_value: true
    initial_value: '0'


sensor:
  - platform: template
    id: alarm_state
    update_interval: 1s
    lambda: return id(alarm_state_global);
    filters:
      - delta: 1
    on_value:
      - text_sensor.template.publish:
          id: alarm_state_text
          state: !lambda |-
            static std::array<std::string, 7> strings = ${state_strings};
            int y = (int) x;
            return strings[y];

  - platform: template
    id: incorrect_codes_sensor
    name: '${friendly_name} Incorrect Codes'
    lambda: return id(incorrect_codes);
    update_interval: never


text_sensor:
  - platform: state_machine
    id: alarm_state_text
    name: ${friendly_name} Alarm State

  - platform: template
    id: ready_state
    name: ${friendly_name} Ready
    disabled_by_default: true

number:
  - platform: template
    id: arming_timeout
    name: ${friendly_name} Arming Timeout
    restore_value: true
    initial_value: 10
    unit_of_measurement: seconds
    min_value: 0
    max_value: 300
    step: 1
    mode: box
    optimistic: true
    entity_category: config

  - platform: template
    id: pending_timeout
    name: ${friendly_name} Pending Timeout
    restore_value: true
    initial_value: 60
    unit_of_measurement: seconds
    min_value: 0
    max_value: 300
    step: 1
    mode: box
    optimistic: true
    entity_category: config

  - platform: template
    id: trigger_timeout
    name: ${friendly_name} Trigger Timeout
    restore_value: true
    initial_value: 5
    unit_of_measurement: minutes
    min_value: 1
    max_value: 20
    step: 1
    mode: box
    optimistic: true
    entity_category: config


